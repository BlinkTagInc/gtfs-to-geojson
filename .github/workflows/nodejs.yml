name: Node CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint, formatting and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck

  test:
    name: Tests on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24.22.3
            color: '0'
          - node: 24
            color: '1'
          - node: 26
            color: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          FORCE_COLOR: ${{ matrix.color }}

  minimum-runtime:
    name: Installed package on Node.js 24.22.3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
      - run: node --test test/package/release-smoke.mjs
